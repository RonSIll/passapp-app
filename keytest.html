<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Key Test">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; manifest-src 'self'">
<link rel="manifest" href="keytest.webmanifest">
<title>PassApp Key Test</title>
<style>
  :root { --bg: #fff; --text: #1c1c1e; --text2: #6b6b70; --border: #e3e3e6; --green: #84cc16; --red: #ff3b30; }
  @media (prefers-color-scheme: dark) { :root { --bg: #000; --text: #f5f5f7; --text2: #98989d; --border: #2c2c2e; --green: #a6e22e; --red: #ff453a; } }
  body { margin: 0; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    padding: calc(env(safe-area-inset-top) + 20px) 16px calc(env(safe-area-inset-bottom) + 20px); }
  h1 { font-size: 22px; margin: 0 0 12px; }
  #verdict { font-size: 20px; font-weight: 700; padding: 16px; border: 2px solid var(--border); margin: 16px 0; }
  #verdict.pass { border-color: var(--green); color: var(--green); }
  #verdict.fail { border-color: var(--red); color: var(--red); }
  button { display: block; width: 100%; min-height: 48px; margin: 10px 0; font: inherit; font-size: 16px;
    font-weight: 600; border: 1px solid var(--border); background: none; color: var(--text); }
  button.primary { background: var(--green); border-color: var(--green); color: #1c1c1e; }
  #log { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 12px; color: var(--text2);
    white-space: pre-wrap; border-top: 1px solid var(--border); padding-top: 10px; margin-top: 16px; }
  p { color: var(--text2); line-height: 1.45; }
</style>
</head>
<body>
<h1>PassApp Key Test</h1>
<div id="verdict">Checking...</div>
<button class="primary" id="save">Step 1: Save a test key</button>
<button id="clear">Start over</button>
<p>No real passwords are used. This page only stores a made-up test key on this phone.</p>
<div id="log"></div>

<script>
(function () {
  var DB = "passapp-keytest", STORE = "keys", SECRET = "PassApp key test 2026";
  var verdict = document.getElementById("verdict"), logEl = document.getElementById("log");
  function log(m) { logEl.textContent += m + "\n"; }
  function say(text, cls) { verdict.textContent = text; verdict.className = cls || ""; }

  var standalone = window.navigator.standalone === true ||
    (window.matchMedia && window.matchMedia("(display-mode: standalone)").matches);

  function openDb() {
    return new Promise(function (res, rej) {
      var r = indexedDB.open(DB, 1);
      r.onupgradeneeded = function () { r.result.createObjectStore(STORE); };
      r.onsuccess = function () { res(r.result); };
      r.onerror = function () { rej(r.error); };
    });
  }
  function tx(mode, fn) {
    return openDb().then(function (db) {
      return new Promise(function (res, rej) {
        var t = db.transaction(STORE, mode), out;
        Promise.resolve(fn(t.objectStore(STORE))).then(function (v) { out = v; });
        t.oncomplete = function () { db.close(); res(out); };
        t.onerror = function () { db.close(); rej(t.error); };
      });
    });
  }
  function get(k) {
    return openDb().then(function (db) {
      return new Promise(function (res, rej) {
        var r = db.transaction(STORE, "readonly").objectStore(STORE).get(k);
        r.onsuccess = function () { db.close(); res(r.result); };
        r.onerror = function () { db.close(); rej(r.error); };
      });
    });
  }
  function put(k, v) { return tx("readwrite", function (s) { s.put(v, k); }); }
  function clearAll() { return tx("readwrite", function (s) { s.clear(); }); }

  function decryptCheck(rec) {
    return crypto.subtle.decrypt({ name: "AES-GCM", iv: rec.iv }, rec.key, rec.ct).then(function (pt) {
      return new TextDecoder().decode(pt) === SECRET;
    });
  }

  function check() {
    log("Running as home-screen app: " + (standalone ? "yes" : "no"));
    return get("test").then(function (rec) {
      if (!rec) {
        say(standalone ? "Ready. Tap Step 1." : "Add this page to your Home Screen first, then open it from there.", "");
        return;
      }
      log("Stored key found. Saved " + new Date(rec.savedAt).toLocaleString());
      log("Key type: " + (rec.key && rec.key.constructor ? rec.key.constructor.name : typeof rec.key) +
        ", extractable: " + (rec.key && rec.key.extractable));
      return decryptCheck(rec).then(function (ok) {
        var reopened = Date.now() - rec.savedAt > 5000;
        if (ok && reopened) {
          say("PASS. The key survived closing the app.", "pass");
        } else if (ok) {
          say("Saved. Now close the app completely and reopen it from the Home Screen.", "");
        } else {
          say("FAIL. The key came back but couldn't unlock the test data.", "fail");
        }
        log("Unlock test: " + (ok ? "worked" : "did not work"));
      });
    }).catch(function (e) {
      say("FAIL. " + (e && e.name ? e.name : "Error") + " while reading the stored key.", "fail");
      log("Error: " + (e && e.message ? e.message : e));
    });
  }

  document.getElementById("save").addEventListener("click", function () {
    say("Saving...", "");
    var key, iv = crypto.getRandomValues(new Uint8Array(12));
    crypto.subtle.generateKey({ name: "AES-GCM", length: 256 }, false, ["encrypt", "decrypt"]).then(function (k) {
      key = k;
      return crypto.subtle.encrypt({ name: "AES-GCM", iv: iv }, key, new TextEncoder().encode(SECRET));
    }).then(function (ct) {
      return put("test", { key: key, iv: iv, ct: ct, savedAt: Date.now() });
    }).then(function () {
      log("Saved a non-extractable test key.");
      return navigator.storage && navigator.storage.persist ? navigator.storage.persist() : null;
    }).then(function (p) {
      log("Persistent storage granted: " + (p === null ? "not supported" : p));
      return check();
    }).catch(function (e) {
      say("FAIL. " + (e && e.name ? e.name : "Error") + " while saving the key.", "fail");
      log("Error: " + (e && e.message ? e.message : e));
    });
  });

  document.getElementById("clear").addEventListener("click", function () {
    clearAll().then(function () { logEl.textContent = ""; return check(); });
  });

  check();
})();
</script>
</body>
</html>
